[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animated-talker"
version = "0.2.0"
description = "Generate talking-head videos with lip-sync and head motion from a portrait image and audio file"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Animated Talker Contributors" }]
keywords = ["lip-sync", "talking-head", "avatar", "video-generation", "sadtalker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core (shared by all engines)
    "torch>=2.0",
    "torchvision>=0.15",
    "opencv-python>=4.9",
    "numpy>=1.23",
    "librosa>=0.10",
    "Pillow>=9.0",
    "huggingface-hub>=0.20",
    "face-alignment>=1.4",
    "tqdm>=4.60",
    "soundfile>=0.12",
    # SadTalker engine dependencies
    "kornia>=0.6",
    "scipy>=1.10",
    "scikit-image>=0.19",
    "facexlib>=0.3",
    "yacs>=0.1.8",
    "pyyaml",
    "imageio>=2.19",
    "imageio-ffmpeg>=0.4",
    "safetensors",
]

[project.optional-dependencies]
# MuseTalk engine requires diffusers/transformers (heavier deps)
musetalk = [
    "diffusers>=0.25",
    "transformers>=4.36",
]
postprocess = [
    "basicsr>=1.4",
    "realesrgan>=0.3",
    "gfpgan>=1.3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
animated-talker = "animated_talker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/animated_talker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
